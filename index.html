<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0; padding: 0;
            background-color: #0d1117 !important; /* HARMONISÉ */
            color: #f0f6fc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            overflow: hidden; height: 100vh;
            display: flex; justify-content: center;
        }
        .container { position: relative; width: 100%; text-align: center; }
        .credits {
            position: absolute; top: 100%; width: 100%;
            animation: scrollUp 18s linear infinite;
        }
        .title-section { color: #39d353; font-size: 1.5rem; margin-bottom: 50px; font-weight: bold; }
        .name { font-size: 2.5rem; margin-bottom: 20px; font-weight: bold; color: #ffffff; }
        @keyframes scrollUp { 
            0% { transform: translateY(0); } 
            100% { transform: translateY(-280%); } 
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="credits">
            <div class="title-section">ÉQUIPE ADRN</div>
            <div class="name">Yassine BENEKOUR</div>
            <div class="name">Vincent BARDIN</div>
            <div class="name">Théophane BROHIER</div>
            <div class="name">Romain CHEVALIER</div>
            <div class="name">Théo COUACAULT</div>
            <div class="name">Sebastien DUCHENE</div>
            <div class="name">Diego MAQUAIRE</div>
            <div class="name">Jean-Claude PINOTEAU</div>
            <div class="name">Aurore REFAIT</div>
        </div>
    </div>
</body>
</html>
